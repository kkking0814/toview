<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>회원가입 | TOVIEW</title>
        <link rel="stylesheet" href="css/core.css">
        <link rel="stylesheet" href="css/simple.css">
    </head>
    <body>
        <main class="wrap" style="max-width:560px">
            <div class="page-title">
                <h1>회원가입</h1>
                <p class="muted">이메일 인증 후 계정을 생성합니다.</p>
            </div>
            <form class="card card-body" id="registerForm">
                <input class="btn" style="width:100%;margin-bottom:8px" id="username" placeholder="아이디 · 영문 5자 이상">
                <input class="btn" style="width:100%;margin-bottom:8px" id="nickname" placeholder="닉네임 · 한글 2자 이상">
                <input class="btn" style="width:100%;margin-bottom:8px" id="email" type="email" placeholder="이메일">
                <button class="btn" type="button" id="sendCode" style="width:100%;margin-bottom:8px">인증번호 보내기</button>
                <input class="btn" style="width:100%;margin-bottom:8px" id="emailCode" inputmode="numeric" maxlength="6" placeholder="6자리 인증번호">
                <button class="btn" type="button" id="verifyCode" style="width:100%;margin-bottom:8px">이메일 인증</button>
                <div id="verifyState" class="muted" style="margin-bottom:8px">이메일 인증이 필요합니다.</div>
                <input class="btn" style="width:100%;margin-bottom:8px" id="password" type="password" placeholder="비밀번호 · 영문+숫자 8자 이상">
                <button class="btn primary" style="width:100%">가입하기</button>
            </form>
            <p>
                <a href="account.html">로그인으로</a>
            </p>
        </main>
        <script src="js/core.js">
        </script>
        <script src="js/register.js">
        </script>
    </body>
</html>
