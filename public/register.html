<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOVIEW 회원가입</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07111f;
    color:#fff;
    font-family:Arial, sans-serif;
}

.top{
    height:64px;
    border-bottom:1px solid #1c2b40;
}

.bar{
    max-width:1160px;
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#fff;
    font-size:28px;
    font-weight:900;
    text-decoration:none;
}

.logo b{
    color:#4d91ff;
}

.login{
    border:1px solid #3264a8;
    border-radius:8px;
    padding:10px 20px;
    background:#10284b;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.wrap{
    max-width:480px;
    margin:40px auto;
    padding:0 15px;
}

.card{
    background:#0d1b2e;
    border:1px solid #263b58;
    border-radius:14px;
    overflow:hidden;
}

.head{
    padding:18px;
    border-bottom:1px solid #263b58;
    font-size:17px;
    font-weight:800;
}

.form{
    padding:18px;
}

.form input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #334761;
    border-radius:6px;
    outline:none;
    font-size:14px;
}

.email-row{
    display:flex;
    gap:8px;
}

.email-row input{
    flex:1;
}

.email-row button{
    height:43px;
    white-space:nowrap;
    border:0;
    border-radius:6px;
    padding:0 14px;
    background:#1d4f91;
    color:white;
    cursor:pointer;
}

.register-btn{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:0;
    border-radius:7px;
    background:#2f6fed;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.message{
    min-height:20px;
    margin:10px 0;
    color:#8fb8ff;
    font-size:12px;
}

.back{
    display:block;
    margin-top:14px;
    color:#8ca0bb;
    text-align:center;
    text-decoration:none;
    font-size:13px;
}
</style>
</head>

<body>

<header class="top">
    <div class="bar">

        <a class="logo" href="index.html">
            TO<b>VIEW</b>
        </a>

<button
    class="login"
    id="userBtn"
    type="button"
    onclick="location.href='account.html'"
>
    로그인
</button>        

    </div>
</header>


<main class="wrap">

    <div class="card">

        <div class="head">
            TOVIEW 회원가입
        </div>

        <div class="form">

            <input
                id="username"
                type="text"
                placeholder="아이디"
                autocomplete="username"
            >

            <input
                id="nickname"
                type="text"
                placeholder="닉네임"
            >

            <input
                id="password"
                type="password"
                placeholder="비밀번호"
                autocomplete="new-password"
            >

            <input
                id="passwordCheck"
                type="password"
                placeholder="비밀번호 확인"
                autocomplete="new-password"
            >


            <div class="email-row">

                <input
                    id="email"
                    type="email"
                    placeholder="이메일"
                >

                <button
                    type="button"
                    onclick="sendEmailCode()"
                >
                    인증번호 발송
                </button>

            </div>


            <div class="email-row">

                <input
                    id="emailCode"
                    type="text"
                    inputmode="numeric"
                    maxlength="6"
                    placeholder="인증번호 6자리"
                >

                <button
                    type="button"
                    onclick="verifyEmailCode()"
                >
                    인증 확인
                </button>

            </div>


            <div
                id="message"
                class="message"
            ></div>


            <button
                class="register-btn"
                type="button"
                onclick="register()"
            >
                회원가입
            </button>


            <a
                class="back"
                href="account.html"
            >
                이미 계정이 있으신가요? 로그인
            </a>

        </div>

    </div>

</main>


<script>

let emailVerified = false;


/* ================================
   인증번호 발송
================================ */

async function sendEmailCode(){

    const email =
        document.getElementById('email')
        .value
        .trim()
        .toLowerCase();

    if(!email){
        showMessage('이메일을 입력해주세요.');
        return;
    }

    try{

        const response =
            await fetch('/api/email/send-code',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    email
                })

            });

        const data = await response.json();

        if(!response.ok){

            showMessage(
                data.error ||
                '인증번호 발송에 실패했습니다.'
            );

            return;
        }

        emailVerified = false;

        showMessage(
            '인증번호를 발송했습니다. 이메일을 확인해주세요.'
        );

    }catch(error){

        console.error(error);

        showMessage(
            '서버 연결 중 오류가 발생했습니다.'
        );
    }
}


/* ================================
   이메일 인증번호 확인
================================ */

async function verifyEmailCode(){

    const email =
        document.getElementById('email')
        .value
        .trim()
        .toLowerCase();

    const code =
        document.getElementById('emailCode')
        .value
        .trim();

    if(!email || !code){

        showMessage(
            '이메일과 인증번호를 입력해주세요.'
        );

        return;
    }

    try{

        const response =
            await fetch('/api/email/verify-code',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    email,
                    code
                })

            });

        const data = await response.json();

        if(!response.ok){

            emailVerified = false;

            showMessage(
                data.error ||
                '인증번호가 올바르지 않습니다.'
            );

            return;
        }

        emailVerified = true;

        showMessage(
            '이메일 인증이 완료되었습니다.'
        );

    }catch(error){

        console.error(error);

        showMessage(
            '서버 연결 중 오류가 발생했습니다.'
        );
    }
}


/* ================================
   회원가입
================================ */

async function register(){

    const username =
        document.getElementById('username')
        .value
        .trim();

    const nickname =
        document.getElementById('nickname')
        .value
        .trim();

    const password =
        document.getElementById('password')
        .value;

    const passwordCheck =
        document.getElementById('passwordCheck')
        .value;

    const email =
        document.getElementById('email')
        .value
        .trim()
        .toLowerCase();


    if(
        !username ||
        !nickname ||
        !password ||
        !passwordCheck ||
        !email
    ){
        showMessage('모든 항목을 입력해주세요.');
        return;
    }


    if(password !== passwordCheck){

        showMessage(
            '비밀번호가 서로 일치하지 않습니다.'
        );

        return;
    }


    if(!emailVerified){

        showMessage(
            '이메일 인증을 먼저 완료해주세요.'
        );

        return;
    }


    try{

        const response =
            await fetch('/api/register',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    username,
                    password,
                    nickname,
                    email
                })

            });


        const data = await response.json();


        if(!response.ok){

            showMessage(
                data.error ||
                '회원가입에 실패했습니다.'
            );

            return;
        }


        alert('회원가입이 완료되었습니다.');

        location.href = 'index.html';


    }catch(error){

        console.error(error);

        showMessage(
            '서버 연결 중 오류가 발생했습니다.'
        );
    }
}


/* ================================
   안내 메시지
================================ */

function showMessage(text){

    document.getElementById('message')
        .textContent = text;
}


/* 이메일을 바꾸면 다시 인증해야 함 */

document
.getElementById('email')
.addEventListener('input',function(){

    emailVerified = false;

});

</script>

<script src="auth.js"></script>
    
</body>
</html>
