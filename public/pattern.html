<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>패턴 | TOVIEW</title>
        <link rel="stylesheet" href="css/core.css">
        <link rel="stylesheet" href="css/pattern.css">
    </head>
    <body>
        <header class="top">
            <div class="bar">
                <a class="brand" href="index.html">
                    <span class="brand-mark">T</span>
                    <span>TOVIEW</span>
                </a>
                <nav class="nav">
                    <a href="index.html">홈</a>
                    <a href="results.html">결과</a>
                    <a href="analysis.html">분석</a>
                    <a href="pattern.html">패턴</a>
                    <a href="sports.html">스포츠</a>
                    <a href="community.html">커뮤니티</a>
                    <a href="ranking.html">랭킹</a>
                    <a href="verified.html">보증업체</a>
                </nav>
                <div class="header-actions">
                    <button class="btn primary" id="loginBtn">로그인</button>
                    <button class="btn" id="userBtn" hidden>내 계정</button>
                </div>
                <div class="profile-menu" id="profileMenu">
                </div>
            </div>
        </header>
        <main class="wrap">
            <div class="page-title">
                <h1>패턴 시각화</h1>
                <p class="muted">선택한 게임의 하루 전체 확정 결과</p>
            </div>
            <div class="pattern-controls">
                <div class="game-tabs" id="patternGameTabs">
                </div>
                <input type="date" id="patternDate">
            </div>
            <section class="card">
                <div class="card-head">하루 전체 패턴</div>
                <div class="pattern-board" id="patternBoard">
                </div>
            </section>
        </main>
        <div class="modal" id="moreGames">
            <div class="modal-box">
                <h3>미니게임 더보기</h3>
                <div class="game-tabs more-body">
                </div>
                <button class="btn" data-close-more="1">닫기</button>
            </div>
        </div>
        <script src="js/core.js">
        </script>
        <script src="js/gate.js">
        </script>
        <script src="js/auth.js">
        </script>
        <script src="js/ads.js">
        </script>
        <script src="js/animation.js">
        </script>
        <script src="js/games-ui.js">
        </script>
        <script src="js/pattern.js">
        </script>
    </body>
</html>
