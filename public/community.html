</style></head><body><header class="top"><div class="bar"><a class="logo" href="index.html">TO<b>VIEW</b> <span class="badge">V7</span></a><nav class="nav"><a href="index.html">실시간</a><a href="results.html">결과</a><a href="analysis.html">분석</a><a href="pattern.html">패턴</a><a href="community.html">커뮤니티</a><a href="dashboard.html">대시보드</a></nav><button class="login" onclick="location.href='account.html'" id="userBtn">로그인</button></div></header><main class="wrap"><div class="grid"><div class="card"><div class="head"><span id="boardName">자유게시판</span><button class="login" onclick="writePost()">글쓰기</button></div><div id="posts"></div></div><aside><div class="card"><div class="head">게시판</div><div class="sideitem" onclick="setBoard('자유게시판')">💬 자유게시판</div><div class="sideitem" onclick="setBoard('분석게시판')">🔥 분석 토론</div><div class="sideitem" onclick="setBoard('공지사항')">📢 공지사항</div></div><div class="card" id="rank" style="margin-top:18px"><div class="head">활동 랭킹</div><div id="ranking"></div></div></aside></div></main><footer class="foot">TOVIEW V7 · 페이지 이동형 프로토타입 · © 2026 TOVIEW</footer><script>function user(){let u=localStorage.getItem('toviewUser');if(u)document.getElementById('userBtn').textContent=u+' 님'};function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}window.addEventListener('DOMContentLoaded',user)</script><script>let board =
    new URLSearchParams(location.search).get('board')
    || '자유게시판';


async function render(){

    const boardName = document.getElementById('boardName');
    const postsBox = document.getElementById('posts');

    if(boardName){
        boardName.textContent = board;
    }

    try{

        const r = await fetch(
            '/api/posts?board=' + encodeURIComponent(board)
        );

        const data = await r.json();

        if(!r.ok){
            throw new Error(data.error || '게시글을 불러오지 못했습니다.');
        }

        const list = data.posts || [];

        if(!list.length){

            postsBox.innerHTML = `
                <div class="sideitem sub">
                    아직 글이 없습니다.
                    로그인 후 첫 글을 작성해보세요.
                </div>
            `;

            renderRanking([]);

            return;
        }


        postsBox.innerHTML = list.map(post => {

            const time = new Date(post.createdAt)
                .toLocaleString('ko-KR');

            return `
                <div class="sideitem" style="cursor:default">

                    <b>${esc(post.title)}</b>

                    <div class="sub">
                        ${esc(post.nickname || post.username)}
                        ·
                        ${time}
                    </div>

                    <p>${esc(post.content)}</p>

                </div>
            `;

        }).join('');


        renderRanking(list);

    }catch(error){

        console.error(error);

        postsBox.innerHTML = `
            <div class="sideitem sub">
                게시글을 불러오는 중 오류가 발생했습니다.
            </div>
        `;
    }
}


function renderRanking(list){

    const ranking = document.getElementById('ranking');

    if(!ranking) return;

    const counts = {};

    list.forEach(post => {

        const name =
            post.nickname ||
            post.username ||
            '알 수 없음';

        counts[name] = (counts[name] || 0) + 1;

    });


    const sorted = Object.entries(counts)
        .sort((a,b) => b[1] - a[1])
        .slice(0,5);


    if(!sorted.length){

        ranking.innerHTML =
            '<div class="sideitem sub">활동 데이터 없음</div>';

        return;
    }


    ranking.innerHTML = sorted.map((item,index) => `
        <div class="sideitem">

            ${index + 1}위 ${esc(item[0])}

            <span
                class="sub"
                style="float:right"
            >
                ${item[1]}글
            </span>

        </div>
    `).join('');
}


function setBoard(name){

    board = name;

    history.replaceState(
        null,
        '',
        '?board=' + encodeURIComponent(name)
    );

    render();
}


async function writePost(){

    /*
       공지사항은 일반 회원 작성 금지
    */
    if(board === '공지사항'){

        alert('공지사항은 관리자만 작성할 수 있습니다.');

        return;
    }


    const title = prompt('제목을 입력하세요');

    if(!title) return;


    const content = prompt('내용을 입력하세요');

    if(!content) return;


    try{

        const r = await fetch('/api/posts',{

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({
                board:board,
                title:title,
                content:content
            })

        });


        const data = await r.json();


        if(!r.ok){

            /*
               로그인하지 않은 경우
            */
            if(r.status === 401){

                alert('로그인이 필요합니다.');

                location.href =
                    'account.html?next=' +
                    encodeURIComponent(
                        'community.html?board=' + board
                    );

                return;
            }


            alert(
                data.error ||
                '게시글 등록에 실패했습니다.'
            );

            return;
        }


        alert('게시글이 등록되었습니다.');

        await render();


    }catch(error){

        console.error(error);

        alert('서버 연결 중 오류가 발생했습니다.');

    }
}

</script>
