<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>결과 | TOVIEW</title>
        <link rel="stylesheet" href="css/core.css">
        <link rel="stylesheet" href="css/results.css">
    </head>
    <body>
        <header class="top">
            <div class="bar">
                <a class="brand" href="index.html">
                    <span class="brand-mark">T</span>
                    <span>TOVIEW</span>
                </a>
                <nav class="nav">
                    <a href="index.html">홈</a>
                    <a href="results.html">결과</a>
                    <a href="analysis.html">분석</a>
                    <a href="pattern.html">패턴</a>
                    <a href="sports.html">스포츠</a>
                    <a href="community.html">커뮤니티</a>
                    <a href="ranking.html">랭킹</a>
                    <a href="verified.html">보증업체</a>
                </nav>
                <div class="header-actions">
                    <button class="btn primary" id="loginBtn">로그인</button>
                    <button class="btn" id="userBtn" hidden>내 계정</button>
                </div>
                <div class="profile-menu" id="profileMenu">
                </div>
            </div>
        </header>
        <main class="wrap">
            <div class="page-title">
                <h1>게임 결과 LIVE</h1>
                <p class="muted">TOVIEW 자체 애니메이션 · 실제 확정 결과 기반</p>
            </div>
            <div class="game-tabs" id="resultsGameTabs">
            </div>
            <div class="results-layout">
                <section class="card results-stage" id="resultsStage">
                </section>
                <aside class="card results-pick" id="pickBox">
                    <div class="card-head">회차 PICK</div>
                    <div class="pick-options">
                        <button data-pick="odd">홀</button>
                        <button data-pick="even">짝</button>
                    </div>
                    <select id="pickVisibility" class="btn" style="width:100%;margin-top:10px">
                        <option value="FOLLOWERS">팔로워 공개</option>
                        <option value="PUBLIC">전체 공개</option>
                        <option value="MUTUALS">맞팔 공개</option>
                        <option value="PRIVATE">나만 보기</option>
                    </select>
                    <button class="btn primary" id="pickSubmit" style="width:100%;margin-top:10px">PICK 확정</button>
                    <p class="muted">등록 후 수정·삭제할 수 없습니다.</p>
                </aside>
            </div>
            <section class="card results-list">
                <div class="card-head">오늘 결과</div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>회차</th>
                                <th>결과</th>
                                <th>확정시간</th>
                            </tr>
                        </thead>
                        <tbody id="resultsRows">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <div class="modal" id="moreGames">
            <div class="modal-box">
                <h3>미니게임 더보기</h3>
                <div class="game-tabs more-body">
                </div>
                <button class="btn" data-close-more="1">닫기</button>
            </div>
        </div>
        <script src="js/core.js">
        </script>
        <script src="js/gate.js">
        </script>
        <script src="js/auth.js">
        </script>
        <script src="js/ads.js">
        </script>
        <script src="js/animation.js">
        </script>
        <script src="js/games-ui.js">
        </script>
        <script src="js/results.js">
        </script>
    </body>
</html>
